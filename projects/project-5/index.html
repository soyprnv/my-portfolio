<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Starfield</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .starfield {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            animation: twinkle 2s infinite ease-in-out;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.2; }
        }

        .star:nth-child(1) { width: 3px; height: 3px; top: 10%; left: 20%; animation-duration: 3s; animation-delay: 0.5s; }
        .star:nth-child(2) { width: 4px; height: 4px; top: 40%; left: 60%; animation-duration: 4s; animation-delay: 1s; }
        .star:nth-child(3) { width: 2px; height: 2px; top: 70%; left: 80%; animation-duration: 2.5s; animation-delay: 0.7s; }
        .star:nth-child(4) { width: 5px; height: 5px; top: 30%; left: 90%; animation-duration: 5s; animation-delay: 0.3s; }
        .star:nth-child(5) { width: 3px; height: 3px; top: 80%; left: 50%; animation-duration: 3.5s; animation-delay: 0.2s; }
        .star:nth-child(6) { width: 4px; height: 4px; top: 60%; left: 30%; animation-duration: 4.5s; animation-delay: 1.2s; }
        .star:nth-child(7) { width: 2px; height: 2px; top: 20%; left: 10%; animation-duration: 2s; animation-delay: 0.8s; }
        .star:nth-child(8) { width: 3px; height: 3px; top: 50%; left: 70%; animation-duration: 3.5s; animation-delay: 0.4s; }
        .star:nth-child(9) { width: 4px; height: 4px; top: 10%; left: 40%; animation-duration: 3s; animation-delay: 0.6s; }
        .star:nth-child(10) { width: 2px; height: 2px; top: 90%; left: 60%; animation-duration: 2.5s; animation-delay: 1.4s; }
    </style>
</head>
<body>
    <div class="starfield">
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
    </div>
</body>
</html>
