<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holographic Card</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #111;
            margin: 0;
        }

        .card {
            width: 300px;
            height: 180px;
            background: linear-gradient(135deg, rgba(255,0,150,0.8), rgba(0,200,255,0.8));
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            font-size: 20px;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
            transition: transform 0.5s ease-in-out;
        }

        .card::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, rgba(255,255,255,0.1), transparent, rgba(255,255,255,0.1));
            animation: holo-effect 5s linear infinite;
        }

        @keyframes holo-effect {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .card:hover {
            transform: scale(1.05) rotateX(10deg) rotateY(10deg);
        }
    </style>
</head>
<body>
    <div class="card">Holographic Card</div>
</body>
</html>
