<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Generator UI</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(45deg, #ff6b6b, #ffb86b, #6b6bff);
            transition: background 1s ease-in-out;
        }

        .gradient-container {
            text-align: center;
            font-family: Arial, sans-serif;
            color: white;
            font-size: 2em;
            font-weight: bold;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            transition: transform 0.5s ease-in-out;
        }

        body:hover {
            background: linear-gradient(135deg, #6b6bff, #ff6b6b, #ffb86b, #50fa7b);
        }

        body:hover .gradient-container {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="gradient-container">
        <h1>Hover to Change Gradient</h1>
    </div>
</body>
</html>
